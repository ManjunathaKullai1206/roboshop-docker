networks:
  defult: 
    driver: bridge
    name: roboshop
    external: true
      
services:
  mongodb:
   image: manjunatha1204/mongodb:v1
   container_name: mongodb

  catalouge:
    image: manjunatha1204/catalouge:v1
    container_name: catalouge
    depends_on:
    - mongodb

  redis:
    image: redis:7.0
    container_name: redis

  user:
    image: manjunatha1204/user:v1
    container_name: user
    depends_on:
    - redis
    - mongodb
  
  cart:
    image: manjunatha1204/cart:v1
    container_name: cart
    depends_on:
    - catalouge
    - redis

  mysql:
    image: manjunatha1204/mysql:v1
    container_name: mysql
  
  shipping:
    image: manjunatha1204/shipping:v1
    container_name: shipping
    depends_on:
    - cart
    - mongodb



  
